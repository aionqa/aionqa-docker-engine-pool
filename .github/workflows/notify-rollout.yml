# Run this workflow when you want all helpers to restart and pick up the latest image.
# Does not build or push; only notifies admin-api so helpers exit on next poll (restart: always).
name: Notify helpers (rollout)

on:
  workflow_dispatch:

jobs:
  notify:
    name: Notify admin-api – restart shared helpers
    runs-on: [self-hosted, aionqa-ci]
    steps:
      - name: Notify admin-api
        run: |
          echo "POST https://admin-api.aionqa.com/api/admin/docker-engines/notify-new-image (image=aionqa-docker-engine-pool)"
          curl -fsS -X POST "https://admin-api.aionqa.com/api/admin/docker-engines/notify-new-image" \
            -H "Content-Type: application/json" \
            -d '{"image":"aionqa-docker-engine-pool"}'
          echo ""
          echo "✅ Done. Shared helpers will restart on next poll."
